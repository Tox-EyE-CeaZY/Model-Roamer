<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a1113">
  <title>Model Roamer</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/ui/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/ui/css/fonts.css">
  <link rel="stylesheet" href="/ui/css/base.css">
  <link rel="stylesheet" href="/ui/css/app.css">
  <link rel="stylesheet" href="/ui/css/voice.css">
  <link rel="stylesheet" href="/ui/css/attention.css">
  <script>
    // the last look, before anything paints (no flash of the wrong theme)
    try {
      const l = JSON.parse(localStorage.getItem('mr-look') || '{}');
      if (l.theme) document.documentElement.dataset.theme = l.theme;
      if (l.hue != null) document.documentElement.style.setProperty('--hue', l.hue);
    } catch (e) {}
  </script>
</head>
<body>
  <canvas id="topo"></canvas>
  <div class="grain"></div>
  <header id="titlebar"></header>
  <div id="shell">
    <nav id="side"></nav>
    <main id="view"><div class="boot"><span class="hatch"></span><span>Starting Model Roamer</span></div></main>
  </div>
  <div id="toasts"></div>
  <noscript>Model Roamer needs JavaScript.</noscript>
  <script type="module" src="/ui/js/app.js"></script>
</body>
</html>
