[package]
name = "model-roamer"
version = "0.1.0"
edition = "2021"
description = "An AI orchestration studio in the Roamer suite: one lead agent runs Claude Code, Codex, Gemini and Antigravity together"
license = "MIT"
default-run = "model-roamer"

[[bin]]
name = "model-roamer"
path = "src/main.rs"

[features]
default = ["desktop"]
# The windowed app. Build with --no-default-features for a headless server (no GTK/WebKit needed on Linux).
desktop = ["dep:tao", "dep:wry", "dep:tray-icon"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
which = "7"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1"
percent-encoding = "2"
open = "5"
hostname = "0.4"

tao = { version = "0.34", optional = true }
wry = { version = "0.53", optional = true, features = ["devtools"] }
tray-icon = { version = "0.21", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
